# Development toolchain for this repository, and the single place the Node
# version is written. .github/workflows/ci.yml reads this file through
# actions/setup-node's node-version-file, so continuous integration and a
# local `mise install` always agree.
#
# Node is the only thing needed: the two validation scripts run on it, and
# markdownlint-cli2 comes from npm.

[tools]
node = "24.20.0"
